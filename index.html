<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Flashcards</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="App di flashcards per imparare vocabolario con ripetizione dilazionata">
  <meta name="theme-color" content="#c9a227">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Flashcards">

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Icons -->
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- TEMA -->
  <button id="theme-toggle" class="theme-btn" aria-label="Cambia tema">🌓</button>

  <!-- HOME -->
  <div id="home" class="screen">
    <h1>Flashcards</h1>
    <p>Scegli un mazzo per iniziare</p>
    <div id="deck-list"></div>

    <!-- STRUMENTI PROGRESSI -->
    <div id="tools" class="tools-card">
      <h3>Strumenti</h3>
      <div class="tools-row">
        <button id="btn-export" class="tools-btn">Esporta progressi</button>
        <button id="btn-reset" class="tools-btn btn-danger">Reset progressi</button>
      </div>
      <div class="tools-import">
        <label for="import-file">Importa da file JSON:</label>
        <input type="file" id="import-file" accept=".json">
      </div>
      <p id="tools-hint" class="tools-hint">I dati restano sul tuo dispositivo: nulla viene inviato a server esterni.</p>
    </div>
  </div>

  <!-- TRAINER -->
  <div id="trainer" class="screen hidden">
    <button id="back" class="back-btn">← Torna ai mazzi</button>

    <h2 id="deck-title"></h2>

    <div id="card" class="card">
      <div class="front"></div>
      <div class="back"></div>
    </div>

    <div class="buttons">
      <button id="know">So</button>
      <button id="dontknow">Non so</button>
    </div>

    <button id="quiz-mode" class="quiz-btn">Modalità Quiz</button>
  </div>

  <!-- STATISTICHE -->
  <div id="stats" class="screen hidden">
    <button id="stats-back" class="back-btn">← Torna</button>
    <h2>Statistiche</h2>
    <p id="total-cards"></p>
    <p id="known-cards"></p>
    <p id="accuracy"></p>
  </div>

  <!-- SCRIPT -->
  <script src="data.js"></script>
  <script src="progress-utils.js"></script>
  <script src="progress-init.js"></script>
  <script src="app.js"></script>

  <!-- Registrazione Service Worker -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("sw.js")
          .then((reg) => {
            console.log("Service Worker registrato:", reg.scope);
          })
          .catch((err) => {
            console.warn("Registrazione SW fallita:", err);
          });
      });
    }
  </script>

</body>
</html>
